# Test de fumée : l'application se charge, les comptages sont ceux des données,
# les gestes du quotidien fonctionnent (tests/smoke.js). Une minute par PR.
name: Test de fumée

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer Playwright
        run: npm ci --no-audit --no-fund
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Lancer le test
        run: npm test
